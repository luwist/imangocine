  <nav class="sidebar__nav">
    @for (menu of menuItems; track $index) {
      <div class="sidebar__section">
        @if (menu.label) {
          <h3 class="sidebar__section-title">{{ menu.label }}</h3>
        }

        <ul class="sidebar__menu">
          @for (submenu of menu.items; track $index) {
            <li class="sidebar__item">
              <a
                [routerLink]="[submenu.routerLink]"
                routerLinkActive="sidebar__link--active"
                class="sidebar__link"
              >
                <img [src]="'icons/' + submenu.icon + '.svg'" alt="" />
                <span class="sidebar__text">{{ submenu.label }}</span>
              </a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
