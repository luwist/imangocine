<p-toast position="bottom-center" />

<section class="food-step">
  @if (loading()) {
    <p-skeleton width="200px" height="24px" borderRadius="50px" />

    <div class="food-step__grid">
      @for (item of skeletonItems; track $index) {
        <app-food-card-skeleton />
      }
    </div>
  } @else {
    @for (group of combos(); track group.category.id) {
      <h2 class="food-step__title">{{ group.category.name }}</h2>

      <div class="food-step__grid">
        @for (combo of group.combos; track combo.id) {
          <app-food-card
            [combo]="combo"
            [quantity]="quantityOf(combo.id)"
            (increase)="increase($event)"
            (decrease)="decrease($event)"
          />
        }
      </div>
    }
  }
</section>
