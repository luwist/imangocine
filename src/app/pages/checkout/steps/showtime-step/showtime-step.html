<h1 class="title">Horarios</h1>

<section class="selector">
  <h2 class="selector__title">Día</h2>

  <div class="picker-list">
    @for (option of dateOptions(); track option.value) {
      <button
        type="button"
        class="day-picker"
        [ngClass]="{ 'picker---active': selectedDay() === option.value }"
        (click)="onSelectedDate(option.value)"
      >
        <span class="day-picker--name">{{ option.label }}</span>
        <span class="day-picker--subname">{{ option.dayNumber }} {{ option.monthLabel }}</span>
      </button>
    } @empty {
      <p class="selector__empty">No hay funciones para este día.</p>
    }
  </div>
</section>

<section class="selector">
  <h2 class="selector__title">Hora</h2>

  <div class="picker-list">
    @for (group of groupsForSelectedDate(); track group.label) {
      @for (showtime of group.showtimes; track showtime.id) {
        <button type="button" class="time-picker" (click)="onSelectedTime(showtime)">
          <span
            class="time-picker--name"
            [ngClass]="{ 'picker---active': selectedTime() === showtime.id }"
          >
            {{ showtime.starts_at | date: 'h:mm a' }}
          </span>

          <span class="time-picker--subname">{{ showtime.format }}</span>
        </button>
      }
    } @empty {
      <p class="selector__empty">No hay funciones para este día.</p>
    }
  </div>
</section>
