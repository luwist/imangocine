<button
  class="seat"
  [class.seat--vip]="seat().type === 'vip'"
  [class.seat--accessible]="seat().type === 'accessible'"
  [class.seat--occupied]="seat().status === 'occupied'"
  [class.seat--selected]="seat().status === 'selected'"
  [disabled]="seat().status === 'occupied'"
  (click)="onClick()"
>
  @if (seat().status === 'occupied') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M16.777 8.288 8.29 16.773c-.29.29-.77.29-1.06 0a.755.755 0 0 1 0-1.06l8.485-8.486c.29-.29.77-.29 1.06 0s.29.77 0 1.06"
        fill="#fff"
      />
      <path
        d="M16.777 16.773a.756.756 0 0 1-1.061 0L7.23 8.288a.755.755 0 0 1 0-1.061c.29-.29.77-.29 1.06 0l8.485 8.485c.29.29.29.771 0 1.06"
        fill="#fff"
      />
    </svg>
  } @else if (seat().type === 'accessible') {
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M20.39 20.14L18.33 11.82L18.19 11.25H14.97V8.31H17.19V6.81H7.19V1.25H2.36V2.75H5.69V10.41C3.12 11.21 1.25 13.61 1.25 16.44C1.25 19.92 4.08 22.75 7.56 22.75C9.96 22.75 12.06 21.4 13.12 19.42H18.66L19.07 21.07L19.21 21.64H22.75V20.14H20.39ZM7.19 8.31H13.47V11.25H11.14C10.0901 10.5177 8.84006 10.1267 7.56 10.13C7.43 10.13 7.31 10.13 7.19 10.15V8.31ZM7.56 21.25C4.9 21.25 2.75 19.1 2.75 16.44C2.75 13.78 4.7 11.83 7.19 11.64C7.31 11.63 7.43 11.63 7.56 11.63C8.74 11.63 9.81 12.05 10.65 12.75C11.7 13.64 12.37 14.96 12.37 16.44C12.37 19.1 10.22 21.25 7.56 21.25ZM13.69 17.92C13.8113 17.4361 13.8718 16.9389 13.87 16.44C13.87 15.06 13.43 13.79 12.67 12.75H17.01L18.29 17.92H13.69Z"
        fill="white"
      />
    </svg>
  } @else {
    {{ seat().code }}
  }
</button>
